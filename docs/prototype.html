<style>
  :root {
    --bg: #04050b; --ink: #ffffff;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #04050b; --ink: #ffffff; } }
  :root[data-theme="dark"] { --bg: #04050b; --ink: #ffffff; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: calc(96px + env(safe-area-inset-top, 0px)); background: var(--bg); scroll-behavior: smooth; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  img, svg, canvas { max-width: 100%; }
  button { cursor: pointer; }
  .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ---------- cold, metallic accent system ---------- */
  .app {
    --a1: #f8fafc; --a2: #c7d2fe; --a3: #7dd3fc;
    --ice: #9cc9ff;
    --glow: rgba(125, 180, 255, .35); --spot: rgba(255, 255, 255, .06);
  }
  .silver { background: linear-gradient(180deg, #ffffff 0%, #d7dce6 45%, #7c8499 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grad-text { background: linear-gradient(100deg, #f8fafc, #c7d2fe 50%, #7dd3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-title { background: linear-gradient(180deg, #ffffff 0%, #e3e7ef 40%, #7d869b 105%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .acc { color: var(--ice); }
  .acc-bg { background: linear-gradient(135deg, #e0e7ff, #a5c8ff 55%, #7dd3fc); color: #05070d; }
  .tile { background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 10px 30px -12px rgba(0,0,0,.8); color: #e6edff; }
  .hl { box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
  .btn-p { background: #f5f7fb; color: #05070d;
    box-shadow: 0 0 0 1px rgba(255,255,255,.6) inset, 0 10px 30px -10px rgba(160,190,255,.45);
    transition: background .2s, transform .15s, box-shadow .25s; }
  .btn-p:hover { background: #ffffff; box-shadow: 0 0 0 1px #fff inset, 0 14px 40px -10px rgba(160,190,255,.65); }
  .hairline { background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); height: 1px; }

  /* ---------- background ---------- */
  .mesh-base { background:
    radial-gradient(ellipse 60% 45% at 85% -5%, rgba(76, 29, 149, .55) 0%, transparent 60%),
    radial-gradient(ellipse 55% 45% at 5% 15%, rgba(8, 47, 92, .65) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 50% 110%, rgba(14, 64, 92, .45) 0%, transparent 60%),
    linear-gradient(180deg, #05060d 0%, #04050b 100%); }
  .grain { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/></svg>"); opacity: .05; mix-blend-mode: overlay; }
  .blob { position: absolute; border-radius: 9999px; filter: blur(120px); opacity: .28; animation: drift 30s ease-in-out infinite alternate; }
  .blob.b2 { animation-duration: 38s; animation-delay: -10s; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-60px, 50px) scale(1.1); } }

  /* ---------- glass interactions ---------- */
  .spot { position: relative; isolation: isolate; }
  .spot::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 55%);
    opacity: 0; transition: opacity .25s; }
  .spot::after { content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; padding: 1px;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(190,215,255,.55), transparent 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
    opacity: 0; transition: opacity .25s; }
  .spot:hover::before, .spot:hover::after { opacity: 1; }
  .tab-pill { position: absolute; top: 4px; bottom: 4px; border-radius: 10px; background: #f5f7fb;
    box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); transition: left .28s cubic-bezier(.2,.8,.2,1), width .28s cubic-bezier(.2,.8,.2,1); }
  .nav-pill { position: absolute; top: 12px; bottom: 12px; border-radius: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
    transition: left .28s cubic-bezier(.2,.8,.2,1), width .28s cubic-bezier(.2,.8,.2,1); }

  .girih-hi { -webkit-mask: radial-gradient(240px circle at var(--gx, -999px) var(--gy, -999px), #000 0%, transparent 72%); mask: radial-gradient(240px circle at var(--gx, -999px) var(--gy, -999px), #000 0%, transparent 72%); opacity: var(--go, 0); transition: opacity .5s ease; }
  /* ---------- range ---------- */
  .rng { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 99px; outline: none;
    background: linear-gradient(to left, #e2e8f0 0, #9cc9ff var(--fill, 50%), rgba(255,255,255,.12) var(--fill, 50%)); }
  .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 0 5px rgba(156,201,255,.18), 0 4px 14px rgba(0,0,0,.6); transition: transform .12s, box-shadow .2s; }
  .rng::-webkit-slider-thumb:hover { transform: scale(1.15); box-shadow: 0 0 0 8px rgba(156,201,255,.22), 0 4px 14px rgba(0,0,0,.6); }
  .rng::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; }

  /* ---------- chip ---------- */
  .core { transition: fill .35s, opacity .35s, filter .35s; }
  .core.on { fill: url(#coreGrad); }
  .core.on:hover { filter: brightness(1.6) drop-shadow(0 0 6px rgba(156,201,255,.9)); }

  /* ---------- motion: short and decisive ---------- */
  .hero-in { animation: heroIn .8s cubic-bezier(.16,1,.3,1) both; }
  .hero-in.d2 { animation-delay: .1s; } .hero-in.d3 { animation-delay: .2s; } .hero-in.d4 { animation-delay: .3s; }
  @keyframes heroIn { from { opacity: 0; transform: translateY(14px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .fade-page { animation: fadePage .35s cubic-bezier(.16,1,.3,1); }
  @keyframes fadePage { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .marquee { display: flex; width: max-content; animation: marq 50s linear infinite; }
  .marquee-wrap:hover .marquee { animation-play-state: paused; }
  @keyframes marq { to { transform: translateX(-50%); } }
  .toast-in { animation: toastIn .3s cubic-bezier(.16,1,.3,1); }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px) scale(.97); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  .drawer-in { animation: drawerIn .3s cubic-bezier(.16,1,.3,1); }
  @keyframes drawerIn { from { transform: translateX(-100%); } to { transform: none; } }
  .pop-in { animation: popIn .2s cubic-bezier(.16,1,.3,1); }
  @keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .line-in { animation: lineIn .22s cubic-bezier(.16,1,.3,1); }
  @keyframes lineIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  .caret { display: inline-block; width: .55em; height: 1.1em; background: #cfe0ff; vertical-align: -0.2em; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .check-draw { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .1s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .scan { animation: scan 2.8s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes scan { 0% { transform: translateY(-100%); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(100%); opacity: 0; } }

  :focus-visible { outline: 2px solid #9cc9ff; outline-offset: 3px; border-radius: 10px; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 10px; }
  ::selection { background: rgba(156,201,255,.35); }
  kbd { font-family: inherit; }
  .tabular { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .blob, .marquee, .hero-in, .fade-page, .toast-in, .drawer-in, .pop-in, .scan, .caret, .line-in { animation: none !important; }
  }
</style>
</head>

<script>
(function () {
  const { useState, useEffect, useMemo, useRef, useLayoutEffect, useContext, createContext } = React;
  const html = htm.bind(React.createElement);
  const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ================= helpers ================= */
  const fa = (n, d = 0) => Number(n).toLocaleString('fa-IR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const toman = n => fa(n) + ' تومان';
  const roundK = n => Math.round(n / 1000) * 1000;
  const scrollToId = id => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: 'start' }); };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('gereh:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('gereh:' + k, JSON.stringify(v)); } catch (e) {} },
  };

  const GLASS = 'bg-white/[0.055] backdrop-blur-xl border border-white/[0.11] hl';
  const GLASS_SOFT = 'bg-white/[0.035] backdrop-blur-xl border border-white/[0.08] hl';
  const GLASS_STRONG = 'bg-white/[0.08] backdrop-blur-2xl border border-white/[0.14] hl';
  const BTN = 'inline-flex items-center justify-center gap-2 rounded-xl font-bold transition duration-200 active:scale-[.97] select-none disabled:opacity-60 disabled:cursor-not-allowed';
  const BTN_P = BTN + ' btn-p';
  const BTN_G = BTN + ' bg-white/[0.06] border border-white/[0.12] text-white hover:bg-white/[0.1] hover:border-white/25';

  const AppCtx = createContext(null);
  const useApp = () => useContext(AppCtx);

  /* spotlight: one global listener drives every .spot card */
  document.addEventListener('pointermove', e => {
    const el = e.target && e.target.closest && e.target.closest('.spot');
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    el.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });

  function useTween(value, dur = 600) {
    const [v, setV] = useState(value);
    const cur = useRef(value);
    useEffect(() => {
      const from = cur.current, to = value;
      if (from === to) return;
      if (REDUCE) { cur.current = to; setV(to); return; }
      let raf, start;
      const step = t => {
        if (!start) start = t;
        const k = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - k, 3);
        cur.current = from + (to - from) * e; setV(cur.current);
        if (k < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
      return () => cancelAnimationFrame(raf);
    }, [value]);
    return v;
  }
  function useInView(opts = { threshold: 0.3 }) {
    const ref = useRef(null);
    const [seen, setSeen] = useState(false);
    useEffect(() => {
      if (!ref.current || seen) return;
      if (!('IntersectionObserver' in window)) { setSeen(true); return; }
      const io = new IntersectionObserver(([en]) => { if (en.isIntersecting) { setSeen(true); io.disconnect(); } }, opts);
      io.observe(ref.current);
      return () => io.disconnect();
    }, [seen]);
    return [ref, seen];
  }
  function Num({ value, d = 0, className = '' }) {
    const v = useTween(value);
    return html`<span className=${className}>${fa(d ? v : Math.round(v), d)}</span>`;
  }
  function Counter({ to, d = 0, prefix = '', suffix = '' }) {
    const [ref, seen] = useInView();
    const v = useTween(seen ? to : 0, 1600);
    return html`<span ref=${ref}>${prefix}${fa(d ? v : Math.round(v), d)}${suffix}</span>`;
  }

  /* ================= icons (inline Lucide, ISC) ================= */
  function Icon({ name, size = 20, className = '', sw = 1.75 }) {
    return html`<svg xmlns="http://www.w3.org/2000/svg" width=${size} height=${size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round"
      className=${'shrink-0 ' + className} aria-hidden="true" dangerouslySetInnerHTML=${{ __html: ICONS[name] || '' }} />`;
  }

  /* ================= logo: two interlocked links + a node ================= */
  let logoSeq = 0;
  function Logo({ size = 36 }) {
    const id = useMemo(() => 'lg' + (++logoSeq), []);
    const A = 'rotate(45 18 24)', B = 'rotate(45 30 24)';
    const rectA = (extra) => html`<rect x="9.5" y="15.5" width="17" height="17" rx="5.5" transform=${A} ...${extra} />`;
    const rectB = (extra) => html`<rect x="21.5" y="15.5" width="17" height="17" rx="5.5" transform=${B} ...${extra} />`;
    return html`
      <svg width=${size} height=${size} viewBox="0 0 48 48" fill="none" role="img" aria-label="نشان گره">
        <defs>
          <linearGradient id=${id + 'g'} x1="4" y1="10" x2="44" y2="38" gradientUnits="userSpaceOnUse">
            <stop style=${{ stopColor: 'var(--a1)' }} />
            <stop offset="0.55" style=${{ stopColor: 'var(--a2)' }} />
            <stop offset="1" style=${{ stopColor: 'var(--a3)' }} />
          </linearGradient>
          <clipPath id=${id + 'c1'}><circle cx="24" cy="18" r="5.2" /></clipPath>
          <clipPath id=${id + 'c2'}><circle cx="24" cy="30" r="5.2" /></clipPath>
          <mask id=${id + 'mB'} maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
            <rect width="48" height="48" fill="#fff" />
            <g clipPath=${'url(#' + id + 'c1)'}>${rectA({ stroke: '#000', strokeWidth: 8, fill: 'none' })}</g>
          </mask>
          <mask id=${id + 'mA'} maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
            <rect width="48" height="48" fill="#fff" />
            <g clipPath=${'url(#' + id + 'c2)'}>${rectB({ stroke: '#000', strokeWidth: 8, fill: 'none' })}</g>
          </mask>
        </defs>
        <g mask=${'url(#' + id + 'mA)'}>${rectA({ stroke: 'url(#' + id + 'g)', strokeWidth: 3.6 })}</g>
        <g mask=${'url(#' + id + 'mB)'}>${rectB({ stroke: 'url(#' + id + 'g)', strokeWidth: 3.6 })}</g>
        <circle cx="24" cy="24" r="2.4" fill=${'url(#' + id + 'g)'} />
      </svg>`;
  }
  function Wordmark({ size = 34, sub = true }) {
    return html`
      <span className="flex items-center gap-2.5">
        <${Logo} size=${size} />
        <span className="text-right leading-none">
          <span className="block font-black text-[1.3rem] tracking-tight">گره</span>
          ${sub && html`<span className="block text-[10px] text-white/50 mt-1 ltr text-right tracking-[0.18em]">gereh.cloud</span>`}
        </span>
      </span>`;
  }

  /* Gereh = girih (گره‌چینی): the brand pattern. A star-and-lattice tessellation
     drawn twice — once faint, once in turquoise revealed around the pointer. */
  let girihSeq = 0;
  const girihDefs = (id, stroke, w) => html`
    <pattern id=${id} width="88" height="88" patternUnits="userSpaceOnUse">
      <g fill="none" stroke=${stroke} strokeWidth=${w}>
        <path d="M44 0L88 44L44 88L0 44Z" />
        <rect x="12.9" y="12.9" width="62.2" height="62.2" />
        <path d="M0 0L12.9 12.9M88 0L75.1 12.9M0 88L12.9 75.1M88 88L75.1 75.1" />
        <path d="M44 31.5L52.8 35.2L56.5 44L52.8 52.8L44 56.5L35.2 52.8L31.5 44L35.2 35.2Z" />
      </g>
    </pattern>`;
  function GirihField({ className = '', base = 'rgba(255,255,255,.055)', fade = true }) {
    const ref = useRef(null);
    const id = useMemo(() => 'gp' + (++girihSeq), []);
    useEffect(() => {
      const el = ref.current; if (!el) return;
      const host = el.parentElement;
      const on = e => { const r = el.getBoundingClientRect(); el.style.setProperty('--gx', (e.clientX - r.left) + 'px'); el.style.setProperty('--gy', (e.clientY - r.top) + 'px'); el.style.setProperty('--go', '1'); };
      const off = () => el.style.setProperty('--go', '0');
      host.addEventListener('pointermove', on); host.addEventListener('pointerleave', off);
      return () => { host.removeEventListener('pointermove', on); host.removeEventListener('pointerleave', off); };
    }, []);
    const m = 'linear-gradient(180deg, transparent, #000 18%, #000 70%, transparent)';
    return html`
      <div ref=${ref} aria-hidden="true" className=${'absolute inset-0 pointer-events-none ' + className} style=${fade ? { maskImage: m, WebkitMaskImage: m } : null}>
        <svg className="absolute inset-0 w-full h-full"><defs>${girihDefs(id, base, 1)}</defs><rect width="100%" height="100%" fill=${'url(#' + id + ')'} /></svg>
        <svg className="absolute inset-0 w-full h-full girih-hi"><defs>${girihDefs(id + 'h', 'rgba(170,205,255,.85)', 1.25)}</defs><rect width="100%" height="100%" fill=${'url(#' + id + 'h)'} /></svg>
      </div>`;
  }
  function GirihStar({ size = 14, className = '' }) {
    return html`<svg width=${size} height=${size} viewBox="0 0 24 24" className=${'shrink-0 ' + className} aria-hidden="true">
      <path d="M12.00,1.00 L13.99,7.20 L19.78,4.22 L16.80,10.01 L23.00,12.00 L16.80,13.99 L19.78,19.78 L13.99,16.80 L12.00,23.00 L10.01,16.80 L4.22,19.78 L7.20,13.99 L1.00,12.00 L7.20,10.01 L4.22,4.22 L10.01,7.20Z" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinejoin="round" />
    </svg>`;
  }

  /* ================= shared UI ================= */
  function Tabs({ options, value, onChange, full = false, size = 'md' }) {
    const refs = useRef({});
    const [pill, setPill] = useState(null);
    const measure = () => { const el = refs.current[value]; if (el) setPill({ left: el.offsetLeft, width: el.offsetWidth }); };
    useLayoutEffect(measure, [value, options.length]);
    useEffect(() => {
      window.addEventListener('resize', measure);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
      return () => window.removeEventListener('resize', measure);
    }, [value]);
    const pad = size === 'sm' ? 'px-3 py-1.5 text-xs' : 'px-4 py-2 text-sm';
    return html`
      <div role="tablist" className=${'relative inline-flex p-1 rounded-2xl bg-white/[0.07] border border-white/15 ' + (full ? 'w-full' : '')}>
        ${pill && html`<span className="tab-pill" style=${{ left: pill.left, width: pill.width }} />`}
        ${options.map(o => html`
          <button key=${o.id} ref=${el => (refs.current[o.id] = el)} role="tab" aria-selected=${value === o.id} onClick=${() => onChange(o.id)}
            className=${'relative z-10 ' + (full ? 'flex-1 ' : '') + pad + ' rounded-xl flex items-center justify-center gap-2 whitespace-nowrap transition-colors duration-300 ' +
              (value === o.id ? 'text-slate-900 font-bold' : 'text-white/70 hover:text-white')}>
            ${o.icon && html`<${Icon} name=${o.icon} size=${16} />`}
            ${o.label}
            ${o.badge && html`<span className=${'text-[10px] px-1.5 py-0.5 rounded-md ' + (value === o.id ? 'bg-emerald-600 text-white' : 'bg-emerald-400/20 text-emerald-300')}>${o.badge}</span>`}
          </button>`)}
      </div>`;
  }

  function Switch({ on, onChange, label }) {
    return html`
      <button role="switch" aria-checked=${on} aria-label=${label} onClick=${() => onChange(!on)}
        className=${'relative w-11 h-6 rounded-full transition-colors duration-300 border ' + (on ? 'acc-bg border-transparent' : 'bg-white/15 border-white/20')}>
        <span className=${'absolute top-0.5 w-[18px] h-[18px] rounded-full bg-white shadow transition-all duration-300 ' + (on ? 'right-[22px]' : 'right-0.5')} />
      </button>`;
  }

  function SectionHead({ title, sub, center = true, id }) {
    return html`
      <div id=${id} className=${'mb-10 ' + (center ? 'text-center mx-auto max-w-2xl' : 'max-w-2xl')}>
        <h2 className="text-[1.7rem] sm:text-[2.6rem] font-black leading-[1.4] tracking-tight">${title}</h2>
        ${sub && html`<p className="mt-3 text-white/65 leading-8 text-[15px] sm:text-base">${sub}</p>`}
      </div>`;
  }

  function IconTile({ name, size = 22, cls = 'w-12 h-12 rounded-2xl' }) {
    return html`<div className=${cls + ' grid place-items-center tile shrink-0'}><${Icon} name=${name} size=${size} sw=${1.6} /></div>`;
  }

  function PriceTag({ base, suffix = 'تومان / ماه', big = true }) {

  /* ================= UI kit ================= */
  const INPUT = 'w-full h-11 rounded-xl bg-white/[0.04] border border-white/[0.12] px-3.5 text-sm outline-none placeholder:text-white/30 focus:border-white/35 focus:bg-white/[0.06] transition';

  function Field({ label, hint, error, children, className = '' }) {
    return html`
      <label className=${'block ' + className}>
        ${label && html`<span className="block text-xs text-white/60 mb-2">${label}</span>`}
        ${children}
        ${error ? html`<span className="block text-[11px] text-rose-300 mt-1.5">${error}</span>` : hint ? html`<span className="block text-[11px] text-white/35 mt-1.5">${hint}</span>` : null}
      </label>`;
  }
  function Select({ value, onChange, options, className = '', ltr = false }) {
    return html`
      <div className=${'relative ' + className}>
        <select value=${value} onChange=${e => onChange(e.target.value)} className=${INPUT + ' appearance-none pl-9 ' + (ltr ? 'ltr text-left' : '')}>
          ${options.map(o => typeof o === 'string' ? html`<option key=${o} value=${o} className="bg-[#0d1018]">${o}</option>` : html`<option key=${o.value} value=${o.value} className="bg-[#0d1018]">${o.label}</option>`)}

  };

    return html`<span className=${'inline-flex items-center gap-1.5 text-[11px] font-medium px-2 py-0.5 rounded-md border whitespace-nowrap ' + TONES[tone]}>
      ${dot && html`<span className="w-1.5 h-1.5 rounded-full bg-current" />`}${children}</span>`;

  /* ================= interactive node field (hero background) ================= */
  function NodeField() {
    const ref = useRef(null);
    useEffect(() => {
      const cv = ref.current; if (!cv) return;
      const ctx = cv.getContext('2d');
      let w = 0, h = 0, nodes = [], raf = 0, visible = true;
      const mouse = { x: -9999, y: -9999 };
      const resize = () => {
        const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
        w = r.width; h = r.height; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = Math.round(Math.min(95, (w * h) / 13000));
        nodes = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.28, vy: (Math.random() - 0.5) * 0.28, r: Math.random() * 1.3 + 0.6 }));
      };
      const frame = () => {
        ctx.clearRect(0, 0, w, h);
        for (const n of nodes) {
          n.x += n.vx; n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
          const dx = n.x - mouse.x, dy = n.y - mouse.y, d = Math.hypot(dx, dy);
          if (d < 130 && d > 0) { n.x += (dx / d) * 0.7; n.y += (dy / d) * 0.7; }
        }
        for (let i = 0; i < nodes.length; i++) {
          const a = nodes[i];
          for (let j = i + 1; j < nodes.length; j++) {
            const b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < 120) { ctx.strokeStyle = 'rgba(170,200,255,' + ((1 - d / 120) * 0.16).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
          }
          const dm = Math.hypot(a.x - mouse.x, a.y - mouse.y);
          if (dm < 210) { ctx.strokeStyle = 'rgba(200,225,255,' + ((1 - dm / 210) * 0.55).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
        }
        for (const n of nodes) {
          const near = Math.hypot(n.x - mouse.x, n.y - mouse.y) < 210;
          ctx.fillStyle = near ? 'rgba(230,240,255,.95)' : 'rgba(190,210,255,.42)';
          ctx.beginPath(); ctx.arc(n.x, n.y, n.r + (near ? 0.9 : 0), 0, 6.2832); ctx.fill();
        }
        if (visible && !REDUCE) raf = requestAnimationFrame(frame);
      };
      resize(); frame();
      const host = cv.parentElement;
      const onMove = e => { const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; if (REDUCE) frame(); };
      const onLeave = () => { mouse.x = mouse.y = -9999; };
      host.addEventListener('pointermove', onMove); host.addEventListener('pointerleave', onLeave); window.addEventListener('resize', resize);
      const io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; cancelAnimationFrame(raf); if (visible && !REDUCE) raf = requestAnimationFrame(frame); });
      io.observe(cv);
      return () => { cancelAnimationFrame(raf); io.disconnect(); host.removeEventListener('pointermove', onMove); host.removeEventListener('pointerleave', onLeave); window.removeEventListener('resize', resize); };
    }, []);
    const mask = 'radial-gradient(ellipse 75% 70% at 50% 40%, #000 25%, transparent 78%)';
    return html`<canvas ref=${ref} aria-hidden="true" className="absolute inset-0 w-full h-full pointer-events-none" style=${{ maskImage: mask, WebkitMaskImage: mask }} />`;
  }

    const p = TERM_PLANS.find(x => x.id === plan);
    const cmd = 'gereh server create --plan ' + p.flag + ' --region thr-1 --image ubuntu-24.04';
    const steps = [
      ['allocating ' + p.spec, 8], ['provisioning NVMe Gen4 volume', 11], ['attaching network, IPv4 + IPv6', 9],
      ['applying firewall and DDoS shield', 7], ['booting Ubuntu 24.04 LTS', 14], ['health checks passed', 5],

    useEffect(() => {
      let alive = true; const timers = [];

      if (REDUCE) { setTyped(cmd); setLines(steps); setSec(54); setDone(true); return; }
      let t = 350;
      for (let i = 1; i <= cmd.length; i++) { T(() => setTyped(cmd.slice(0, i)), t); t += 18; }
      t += 220; let acc = 0;
      steps.forEach(st => { t += 360; acc += st[1]; const target = acc; T(() => { setLines(l => [...l, st]); setSec(target); }, t); });
      T(() => setDone(true), t + 320);
      return () => { alive = false; timers.forEach(clearTimeout); };
    }, [run, plan]);

          </div>
          <div className="mono text-[12.5px] leading-[1.9] p-5 h-[300px] sm:h-[318px] overflow-hidden" dir="ltr">
            <div className="text-white/90 break-all"><span className="text-[#9cc9ff]">~</span> <span className="text-white/40">$</span> ${typed}${!lines.length && html`<span className="caret" />`}</div>
            ${lines.map((l, i) => html`
              <div key=${i} className="line-in flex justify-between gap-3">
                <span className="text-white/70 truncate"><span className="text-emerald-300">✓</span> ${l[0]}</span>
                <span className="text-white/25 shrink-0">+${l[1]}s</span>

                <div className="text-white/90 mt-1"><span className="text-[#9cc9ff]">~</span> <span className="text-white/40">$</span> ssh root@185.143.232.17<span className="caret ml-1" /></div>
              </div>`}
          </div>

  /* ================= network status & speed test ================= */
  function uptimeDays(seed) {
    return Array.from({ length: 60 }, (_, i) => { const h = hashStr(seed + i) % 100; return h < 3 ? 'warn' : h < 4 ? 'down' : 'ok'; });
  }
  function Network() {
    const [sel, setSel] = useState('thr');
    const [pings, setPings] = useState(() => Object.fromEntries(LOCS.map(l => [l.id, l.ping])));
    const [hist, setHist] = useState(() => Array.from({ length: 30 }, () => 8 + Math.random() * 3));
    const [hover, setHover] = useState(null);
    const [test, setTest] = useState({ phase: 'idle', p: 0, mbps: 0 });
    const loc = LOCS.find(l => l.id === sel);
    useEffect(() => {
      const t = setInterval(() => {
        setPings(Object.fromEntries(LOCS.map(l => [l.id, Math.max(1, Math.round(l.ping + (Math.random() - 0.5) * (l.ping * 0.25 + 2)))])));
      }, 1300);
      return () => clearInterval(t);
    }, []);
    useEffect(() => { setHist(h => [...h.slice(1), pings[sel]]); }, [pings]);
    useEffect(() => { setHist(Array.from({ length: 30 }, () => loc.ping + (Math.random() - 0.5) * 4)); setTest({ phase: 'idle', p: 0, mbps: 0 }); }, [sel]);
    const runTest = () => {
      if (test.phase === 'run') return;
      let p = 0;
      setTest({ phase: 'run', p: 0, mbps: 0 });
      const t = setInterval(() => {
        p += 4;
        const mb = Math.round(loc.speed * Math.min(1, p / 55) * (0.88 + Math.random() * 0.14));
        if (p >= 100) { clearInterval(t); setTest({ phase: 'done', p: 100, mbps: Math.round(loc.speed * (0.95 + Math.random() * 0.04)) }); }
        else setTest({ phase: 'run', p, mbps: mb });
      }, 70);
    };
    const days = useMemo(() => uptimeDays(sel), [sel]);
    const maxH = Math.max(...hist) * 1.3, minH = 0;
    const w = 300, hh = 60, step = w / (hist.length - 1);
    const path = hist.map((v, i) => (i ? 'L' : 'M') + (i * step).toFixed(1) + ' ' + (hh - ((v - minH) / (maxH - minH)) * hh).toFixed(1)).join(' ');
    const R = 52, C = 2 * Math.PI * R;

    return html`
      <section id="network" className="max-w-6xl mx-auto px-4 sm:px-6 pb-24">
        <${SectionHead} title="شبکه‌ای که می‌توانید ببینید" sub="وضعیت دیتاسنترها را زنده دنبال کنید و سرعت اتصال را خودتان بسنجید." />
        <div className="grid lg:grid-cols-[320px_1fr] gap-5">
          <div className="grid grid-cols-2 lg:grid-cols-1 gap-3">
            ${LOCS.map(l => html`
              <button key=${l.id} onClick=${() => setSel(l.id)} aria-pressed=${sel === l.id}
                className=${'spot rounded-2xl p-4 text-right border backdrop-blur-md transition ' + (sel === l.id ? 'bg-white/[0.16] border-white/40' : 'bg-white/[0.06] border-white/15 hover:bg-white/10')}>
                <div className="flex items-center justify-between">
                  <span className="font-extrabold">${l.label}</span>
                  <span className="relative flex w-2.5 h-2.5"><span className="absolute inset-0 rounded-full bg-emerald-400 animate-ping opacity-50" /><span className="relative w-2.5 h-2.5 rounded-full bg-emerald-400" /></span>
                </div>
                <div className="text-[11px] text-white/45 mt-1">${l.sub}</div>
                <div className="mt-3 flex items-baseline gap-1"><span className="font-black text-xl tabular-nums">${fa(pings[l.id])}</span><span className="text-[11px] text-white/50">ms</span></div>
              </button>`)}
          </div>

          <div className=${GLASS + ' rounded-[1.75rem] p-5 sm:p-7'}>
            <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-6">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 text-sm text-white/60"><${Icon} name="activity" size=${16} className="acc" /> تأخیر شبکه تا ${loc.label}</div>
                <div className="mt-2 flex items-baseline gap-2"><${Num} value=${pings[sel]} className="text-5xl font-black tabular-nums" /><span className="text-white/50">میلی‌ثانیه</span></div>
                <svg viewBox=${'0 0 ' + w + ' ' + hh} preserveAspectRatio="none" className="w-full mt-4" style=${{ height: 64 }}>
                  <path d=${path} fill="none" style=${{ stroke: 'var(--a3)' }} strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
                </svg>
              </div>
              <div className="flex flex-col items-center shrink-0">
                <div className="relative w-36 h-36">
                  <svg viewBox="0 0 120 120" className="w-full h-full -rotate-90">
                    <circle cx="60" cy="60" r=${R} stroke="rgba(255,255,255,.1)" strokeWidth="8" fill="none" />
                    <circle cx="60" cy="60" r=${R} style=${{ stroke: 'var(--p2)', transition: 'stroke-dashoffset .1s linear' }} strokeWidth="8" fill="none" strokeLinecap="round"
                      strokeDasharray=${C} strokeDashoffset=${C * (1 - test.p / 100)} />
                  </svg>
                  <div className="absolute inset-0 grid place-items-center text-center">
                    <div><div className="text-2xl font-black tabular-nums">${test.phase === 'idle' ? '—' : fa(test.mbps)}</div><div className="text-[11px] text-white/50">مگابیت بر ثانیه</div></div>
                  </div>
                </div>
                <button onClick=${runTest} disabled=${test.phase === 'run'} className=${BTN_P + ' mt-4 px-5 py-2.5 text-sm'}>
                  <${Icon} name=${test.phase === 'run' ? 'loader-circle' : test.phase === 'done' ? 'refresh-cw' : 'play'} size=${16} className=${test.phase === 'run' ? 'animate-spin' : ''} />
                  ${test.phase === 'run' ? 'در حال سنجش' : test.phase === 'done' ? 'سنجش دوباره' : 'تست سرعت'}
                </button>
              </div>
            </div>

            <div className="mt-8">
              <div className="flex items-center justify-between text-sm mb-3">
                <span className="text-white/60">آپتایم ۶۰ روز گذشته</span>
                <span className="font-bold text-emerald-300">${fa(loc.up, 3)}٪</span>
              </div>
              <div className="relative flex gap-[3px] h-10 items-stretch" onMouseLeave=${() => setHover(null)}>
                ${days.map((d, i) => html`
                  <span key=${i} onMouseEnter=${() => setHover(i)}
                    className=${'flex-1 rounded-[3px] transition-transform origin-bottom ' + (hover === i ? 'scale-y-110 ' : '') + (d === 'ok' ? 'bg-emerald-400/70 hover:bg-emerald-300' : d === 'warn' ? 'bg-amber-400/80' : 'bg-rose-400/80')} />`)}
                ${hover !== null && html`
                  <div className="absolute -top-12 pointer-events-none px-3 py-1.5 rounded-lg bg-[#0a0c14]/95 border border-white/15 text-[11px] whitespace-nowrap"
                    style=${{ right: Math.min(85, Math.max(0, (hover / days.length) * 100 - 6)) + '%' }}>
                    ${fa(days.length - hover)} روز پیش، ${days[hover] === 'ok' ? 'بدون اختلال' : days[hover] === 'warn' ? 'کندی کوتاه‌مدت' : 'قطعی ۴ دقیقه‌ای'}
                  </div>`}
              </div>
              <div className="flex justify-between text-[10px] text-white/35 mt-2"><span>۶۰ روز پیش</span><span>امروز</span></div>
            </div>
          </div>
        </div>
      </section>`;
  }

  /* ================= Auth ================= */
  function OtpInput({ value, onChange }) {
    const refs = useRef([]);
    const set = (i, v) => {
      const d = v.replace(/[^0-9۰-۹]/g, '').replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).slice(-1);
      const arr = value.padEnd(6, ' ').split(''); arr[i] = d || ' '; const next = arr.join('').replace(/\s+$/, '');
      onChange(next.replace(/ /g, '')); if (d && i < 5) refs.current[i + 1].focus();
    };
    return html`<div className="flex gap-2 justify-center" dir="ltr">
      ${Array.from({ length: 6 }, (_, i) => html`<input key=${i} ref=${el => (refs.current[i] = el)} inputMode="numeric" value=${value[i] || ''} onChange=${e => set(i, e.target.value)}
        onKeyDown=${e => { if (e.key === 'Backspace' && !value[i] && i > 0) refs.current[i - 1].focus(); }} aria-label=${'رقم ' + (i + 1)}
        className="w-11 h-13 sm:w-12 h-12 text-center text-xl font-black rounded-xl bg-white/[0.05] border border-white/15 focus:border-white/50 outline-none tabular" />`)}
    </div>`;
  }

  /* ================= server: Virtualizor feature tabs ================= */
  function ServerTraffic({ s }) {
    const [month, setMonth] = useState(0);
    const months = ['مهر ۱۴۰۵', 'شهریور ۱۴۰۵', 'مرداد ۱۴۰۵'];
    const days = month === 0 ? 14 : 31;
    const data = useMemo(() => { const rnd = x => { const v = Math.sin(x * 12.9898 + hashStr(s.id) % 97 + month * 7.1) * 43758.5453; return v - Math.floor(v); }; return Array.from({ length: days }, (_, i) => { const wk = (i % 7 === 4 || i % 7 === 5) ? 0.6 : 1; return { in: Math.round((10 + rnd(i) * 30) * wk), out: Math.round((30 + rnd(i + 100) * 80) * wk) }; }); }, [s.id, month]);
    const totIn = data.reduce((a, b) => a + b.in, 0), totOut = data.reduce((a, b) => a + b.out, 0);
    const used = totIn + totOut;
    return html`
      <div className="space-y-4">
        <div className="grid sm:grid-cols-3 gap-4">
          <${StatCard} icon="arrow-down-up" label=${'مصرف ' + months[month]} value=${used} suffix="گیگابایت" />
          <${StatCard} icon="trending-up" label="خروجی (out)" value=${totOut} suffix="گیگابایت" />
          <${StatCard} icon="activity" label="ورودی (in)" value=${totIn} suffix="گیگابایت" />
        </div>
        <${Card} title="ترافیک روزانه" icon="activity" action=${html`<${Select} className="w-40" value=${String(month)} onChange=${v => setMonth(+v)} options=${months.map((m, i) => ({ value: String(i), label: m }))} />`}>
          <div className="mb-6"><${Meter} label="سهمیه ماهانه" value=${used} max=${s.bwLimit} right=${fa(used) + ' از ' + fa(s.bwLimit) + ' گیگابایت'} /></div>
          <div className="flex items-end gap-[3px] h-48">
            ${data.map((d, i) => html`
              <div key=${i} className="group relative flex-1 h-full flex flex-col justify-end gap-[2px]" title=${fa(i + 1) + ': ورودی ' + fa(d.in) + '، خروجی ' + fa(d.out) + ' گیگ'}>
                <div className="rounded-t-[3px] bg-[#9cc9ff]/80 group-hover:bg-[#9cc9ff]" style=${{ height: (d.out / 140) * 100 + '%' }} />
                <div className="rounded-b-[3px] bg-white/25 group-hover:bg-white/40" style=${{ height: (d.in / 140) * 100 + '%' }} />
              </div>`)}
          </div>
          <div className="flex justify-between text-[10px] text-white/35 mt-2"><span>۱</span><span>${fa(days)}</span></div>
          <div className="flex gap-5 mt-4 text-xs text-white/55"><span className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm bg-[#9cc9ff]/80" />خروجی</span><span className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm bg-white/25" />ورودی</span></div>
          <p className="text-[11px] text-white/40 mt-4 leading-6">با رسیدن به سقف، طبق تنظیم مدیر یا سرعت شبکه محدود می‌شود یا سرور معلق می‌شود. ترافیک اضافه را از بخش صورتحساب بخرید.</p>
        <//>
      </div>`;
  }

    const [q, setQ] = useState(seed.q || '');
    const [bulk, setBulk] = useState('');
    const [bulkTld, setBulkTld] = useState('.ir');
    const [loading, setLoading] = useState(false);
    const [result, setResult] = useState(null);
    const [bulkRes, setBulkRes] = useState(null);
    const [error, setError] = useState('');
    const [cat, setCat] = useState('all');
    const [filter, setFilter] = useState('');
    const [added, setAdded] = useState({});

    const runSearch = v => {
      const val = v !== undefined ? v : q;
      const parsed = parseDomain(val);
      if (parsed.error) { setError(parsed.error); setResult(null); return; }
      setError(''); setLoading(true); setResult(null);
      setTimeout(() => {
        const ptld = parsed.tld || '.ir';
        const list = TLDS.map(t => ({ ...t, domain: parsed.name + t.tld, available: isAvailable(parsed.name, t.tld) }));
        setResult({ primary: list.find(t => t.tld === ptld), others: list.filter(t => t.tld !== ptld).sort((a, b) => (b.available - a.available) || ((b.hot ? 1 : 0) - (a.hot ? 1 : 0))) });
        setLoading(false);
      }, 700);
    };
    const runBulk = () => {
      const names = bulk.split(/[\s,،]+/).map(s => s.trim()).filter(Boolean).slice(0, 20);
      if (!names.length) { setError('هر نام را در یک خط بنویسید.'); return; }
      setError(''); setLoading(true);
      setTimeout(() => {
        const t = TLDS.find(x => x.tld === bulkTld);
        setBulkRes(names.map(n => { const p = parseDomain(n); return p.error ? { domain: n, invalid: true } : { ...t, domain: p.name + bulkTld, available: isAvailable(p.name, bulkTld) }; }));
        setLoading(false);
      }, 700);
    };
    useEffect(() => { if (seed.q) { setMode('single'); setQ(seed.q); runSearch(seed.q); } }, [seed.n]);
    const order = d => { addToCart({ title: d.domain, meta: 'ثبت یک‌ساله', base: d.reg, icon: 'globe', ltr: true }); setAdded(a => ({ ...a, [d.domain]: true })); };
    const tldList = useMemo(() => TLDS.filter(t => (cat === 'all' || t.cat === cat) && t.tld.includes(filter.trim().toLowerCase())), [cat, filter]);

    const AddBtn = ({ d, small }) => added[d.domain]
      ? html`<span className=${'inline-flex items-center gap-1.5 text-emerald-300 font-bold ' + (small ? 'text-xs' : 'text-sm')}><${Icon} name="circle-check" size=${small ? 15 : 18} /> در سبد</span>`
      : html`<button onClick=${() => order(d)} className=${(small ? BTN_G + ' px-3 py-1.5 text-xs' : BTN_P + ' px-5 py-3 text-sm')}><${Icon} name="plus" size=${small ? 14 : 16} /> ثبت</button>`;

    return html`
      <div className="fade-page pb-8">
        <${PageHeader} icon="globe" crumb="دامنه" title="نامی که می‌ماند" sub="وضعیت نام دلخواه را روی همه پسوندها یک‌جا ببینید و در چند ثانیه ثبت کنید." />
        <div className="max-w-6xl mx-auto px-4 sm:px-6">
          <div className="max-w-2xl mx-auto">
            <div className="flex justify-center mb-4"><${Tabs} size="sm" value=${mode} onChange=${m => { setMode(m); setError(''); }} options=${[{ id: 'single', label: 'جست‌وجوی تکی', icon: 'search' }, { id: 'bulk', label: 'جست‌وجوی گروهی', icon: 'layers' }]} /></div>
            <div className=${GLASS_STRONG + ' rounded-[1.5rem] p-2.5 shadow-2xl shadow-black/30'}>
              ${mode === 'single'
                ? html`<${DomainInput} value=${q} onChange=${setQ} onSearch=${() => runSearch()} loading=${loading} />`
                : html`
                  <div className="fade-in">
                    <textarea value=${bulk} onChange=${e => setBulk(e.target.value)} rows="4" dir="ltr" placeholder=${'mybrand\ncafe-online\nstudio'} aria-label="فهرست نام‌ها"
                      className="w-full rounded-2xl bg-black/20 border border-white/15 focus:border-white/40 outline-none p-4 text-left placeholder:text-white/30 resize-none" />

                      <select value=${bulkTld} onChange=${e => setBulkTld(e.target.value)} aria-label="پسوند" className="h-11 rounded-xl bg-white/10 border border-white/20 px-3 outline-none ltr">
                        ${TLDS.map(t => html`<option key=${t.tld} value=${t.tld} className="bg-[#14113a]">${t.tld}</option>`)}
                      </select>
                      <button onClick=${runBulk} disabled=${loading} className=${BTN_P + ' flex-1 h-11'}><${Icon} name=${loading ? 'loader-circle' : 'search'} size=${18} className=${loading ? 'animate-spin' : ''} /> بررسی همه</button>
                    </div>
                  </div>`}
            </div>
            ${error && html`<div className="pop-in mt-3 flex items-start gap-2 text-sm text-rose-200 bg-rose-500/15 border border-rose-300/30 rounded-xl p-3"><${Icon} name="circle-alert" size=${18} className="mt-0.5" />${error}</div>`}
          </div>

          ${loading && mode === 'single' && html`
            <div className="max-w-4xl mx-auto mt-10 space-y-3">
              ${[0, 1, 2, 3].map(i => html`<div key=${i} className="h-16 rounded-2xl bg-white/[0.06] border border-white/10 animate-pulse" style=${{ animationDelay: i * 0.1 + 's' }} />`)}
            </div>`}

          ${mode === 'single' && result && !loading && html`
            <div className="max-w-4xl mx-auto mt-10 fade-in">
              <div className=${'rounded-[1.75rem] p-6 sm:p-7 backdrop-blur-md border flex flex-col sm:flex-row sm:items-center justify-between gap-5 ' +
                (result.primary.available ? 'bg-emerald-400/[0.13] border-emerald-300/40' : 'bg-rose-400/10 border-rose-300/30')}>
                <div className="flex items-center gap-4">
                  <div className=${'w-14 h-14 rounded-2xl grid place-items-center ' + (result.primary.available ? 'bg-emerald-400/25 text-emerald-200' : 'bg-rose-400/20 text-rose-200')}>
                    <${Icon} name=${result.primary.available ? 'circle-check' : 'circle-x'} size=${28} />
                  </div>
                  <div>
                    <div className="text-2xl sm:text-3xl font-black ltr text-right">${result.primary.domain}</div>
                    <div className="text-sm text-white/70 mt-1">${result.primary.available ? 'آزاد است و همین حالا قابل ثبت است.' : 'قبلا ثبت شده است. پسوندهای آزاد را پایین‌تر ببینید.'}</div>
                  </div>
                </div>
                ${result.primary.available
                  ? html`<div className="flex items-center gap-4"><div className="text-left"><${PriceTag} base=${result.primary.reg} suffix="تومان / سال" big=${false} /></div><${AddBtn} d=${result.primary} /></div>`
                  : html`<button className=${BTN_G + ' px-5 py-3 text-sm'}><${Icon} name="file-search" size=${16} /> اطلاعات WHOIS</button>`}
              </div>
              <div className=${GLASS + ' rounded-[1.75rem] mt-4 divide-y divide-white/10 overflow-hidden'}>
                ${result.others.map(d => html`
                  <div key=${d.tld} className="flex items-center justify-between gap-3 px-5 py-3.5 hover:bg-white/[0.05] transition-colors">
                    <div className="flex items-center gap-3 min-w-0">
                      <span className=${'w-2 h-2 rounded-full shrink-0 ' + (d.available ? 'bg-emerald-400' : 'bg-white/25')} />
                      <span className=${'font-bold ltr truncate ' + (d.available ? '' : 'text-white/40 line-through')}>${d.domain}</span>
                      ${d.promo && d.available && html`<span className="text-[10px] px-2 py-0.5 rounded-md bg-amber-300/20 text-amber-200 shrink-0 flex items-center gap-1"><${Icon} name="badge-percent" size=${11} />تخفیف</span>`}
                    </div>
                    ${d.available
                      ? html`<div className="flex items-center gap-3 shrink-0"><span className="text-sm text-white/75 hidden sm:inline">${toman(price(d.reg))}</span><${AddBtn} d=${d} small /></div>`
                      : html`<span className="text-xs text-white/40 shrink-0">ثبت شده</span>`}
                  </div>`)}
              </div>
            </div>`}

          ${mode === 'bulk' && bulkRes && !loading && html`
            <div className=${GLASS + ' max-w-4xl mx-auto mt-10 rounded-[1.75rem] divide-y divide-white/10 overflow-hidden fade-in'}>
              ${bulkRes.map((d, i) => html`
                <div key=${i} className="flex items-center justify-between gap-3 px-5 py-3.5">
                  <span className=${'font-bold ltr truncate ' + (d.available ? '' : 'text-white/40')}>${d.domain}</span>
                  ${d.invalid ? html`<span className="text-xs text-rose-200">نام نامعتبر</span>`
                    : d.available ? html`<div className="flex items-center gap-3"><span className="text-sm text-white/75 hidden sm:inline">${toman(price(d.reg))}</span><${AddBtn} d=${d} small /></div>`
                    : html`<span className="text-xs text-white/40">ثبت شده</span>`}
                </div>`)}
            </div>`}

          <div className="mt-24">
            <div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-5">
              <div>
                <h3 className="text-2xl font-black">تعرفه پسوندها</h3>
                <p className="text-white/55 text-sm mt-2">قیمت برای یک سال و به تومان. انتقال دامنه‌های ملی رایگان است.</p>
              </div>
              <div className="flex flex-col sm:flex-row gap-3">
                <div className="rounded-xl flex items-center px-3 h-10 bg-white/10 border border-white/20 focus-within:border-white/40">
                  <${Icon} name="search" size=${16} className="text-white/50" />
                  <input value=${filter} onChange=${e => setFilter(e.target.value)} placeholder="فیلتر پسوند" aria-label="فیلتر پسوند" className="bg-transparent outline-none text-sm px-2 w-32 placeholder:text-white/40" />
                </div>
                <div className="overflow-x-auto no-scrollbar"><${Tabs} size="sm" value=${cat} onChange=${setCat} options=${TLD_CATS} /></div>
              </div>
            </div>
            <div className=${GLASS + ' rounded-[1.75rem] overflow-x-auto'}>
              <table className="w-full min-w-[620px] text-sm">
                <thead><tr className="border-b border-white/15 text-white/50">
                  <th className="text-right font-medium p-4">پسوند</th><th className="font-medium p-4">ثبت</th><th className="font-medium p-4">تمدید</th><th className="font-medium p-4">انتقال</th><th className="p-4"></th>
                </tr></thead>
                <tbody>
                  ${tldList.length === 0 && html`<tr><td colSpan="5" className="p-10 text-center text-white/55">پسوندی با این عبارت پیدا نشد. فیلتر را پاک کنید.</td></tr>`}
                  ${tldList.map((t, i) => html`
                    <tr key=${t.tld} className=${'hover:bg-white/[0.06] transition-colors ' + (i % 2 ? 'bg-white/[0.03]' : '')}>
                      <td className="p-4">
                        <span className="font-black text-base ltr">${t.tld}</span>
                        ${t.hot && html`<span className="mr-2 text-[10px] px-2 py-0.5 rounded-md bg-white/10 border border-white/15 acc">محبوب</span>`}
                        ${t.promo && html`<span className="mr-2 text-[10px] px-2 py-0.5 rounded-md bg-amber-300/20 text-amber-200">تخفیف</span>`}
                      </td>
                      <td className="p-4 text-center font-bold">${fa(price(t.reg))}</td>
                      <td className="p-4 text-center text-white/70">${fa(t.renew)}</td>
                      <td className="p-4 text-center text-white/70">${t.transfer === 0 ? 'رایگان' : fa(t.transfer)}</td>
                      <td className="p-4 text-left">
                        <button onClick=${() => { const n = parseDomain(q).name || 'mybrand'; setMode('single'); setQ(n + t.tld); runSearch(n + t.tld); window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' }); }}
                          className=${BTN_G + ' px-3 py-1.5 text-xs'}><${Icon} name="search" size=${14} /> بررسی</button>
                      </td>
                    </tr>`)}
                </tbody>
              </table>
            </div>
          </div>

          <div className="mt-16 grid md:grid-cols-3 gap-4">
            ${[['eye-off', 'محافظت از اطلاعات مالک', 'اطلاعات تماس شما در WHOIS عمومی نمایش داده نمی‌شود.'],
               ['settings-2', 'مدیریت DNS پیشرفته', 'رکوردهای A، CNAME، MX و TXT را از پنل تنظیم کنید.'],
               ['arrow-left-right', 'انتقال آسان', 'کد انتقال را وارد کنید؛ باقی کار با ماست.']].map(([ic, t, d]) => html`
              <div key=${t} className=${'spot rounded-[1.5rem] p-6 ' + GLASS_SOFT}>
                <${IconTile} name=${ic} size=${20} />
                <div className="font-extrabold mt-5">${t}</div><div className="text-white/60 text-sm leading-7 mt-1.5">${d}</div>
              </div>`)}
          </div>
        </div>
      </div>`;
  }

  /* ================= footer ================= */

    const { go, notify } = useApp();
    const cols = [
      ['سرویس‌ها', [['server', 'سرور ابری', 'vps'], ['server-cog', 'سرور اختصاصی', 'vps'], ['layers', 'هاست وب', 'hosting'], ['globe', 'دامنه', 'domains']]],
      ['گره', [['building-2', 'درباره ما', 'about'], ['message-circle', 'تماس با ما', 'contact'], ['file-text', 'قوانین و حریم خصوصی', 'terms'], ['layout-dashboard', 'پنل کاربری', 'panel']]],

                ${[['send', 'تلگرام'], ['message-circle', 'گفت‌وگوی آنلاین'], ['mail', 'ایمیل']].map(([ic, l]) => html`

              </div>

  /* ================= background ================= */
  function MeshBackground() {
    return html`
      <div className="fixed inset-0 z-0 overflow-hidden pointer-events-none" aria-hidden="true">
        <div className="absolute inset-0 mesh-base" />
        <div className="blob" style=${{ width: 620, height: 620, backgroundColor: '#5b21b6', top: '-18%', right: '-10%' }} />
        <div className="blob b2" style=${{ width: 560, height: 560, backgroundColor: '#075985', top: '30%', left: '-16%' }} />
        <svg className="absolute inset-0 w-full h-full opacity-[0.035]">
          <defs><pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#fff" strokeWidth="1" /></pattern></defs>
          <rect width="100%" height="100%" fill="url(#grid)" />
        </svg>
        <div className="absolute inset-0 grain" />
      </div>`;
  }

  /* ================= app ================= */
  const parseHash = () => (window.location.hash.replace(/^#\/?/, '') || 'home');
  const PUBLIC = ['home', 'vps', 'hosting', 'domains', 'about', 'contact', 'terms', 'auth'];

  function App() {
    useDB();
    const [route, setRoute] = useState(parseHash);
    const [cart, setCart] = useState([]);
    const [toast, setToast] = useState(null);
    const [palette, setPalette] = useState(false);
    const [cartOpen, setCartOpen] = useState(false);
    const [domainSeed, setDomainSeed] = useState({ q: '', n: 0 });
    const [showTop, setShowTop] = useState(false);
    const progRef = useRef(null);

    const go = r => { if (r === route) { window.scrollTo({ top: 0, behavior: 'auto' }); return; } window.location.hash = '#/' + r; window.scrollTo({ top: 0, behavior: 'auto' }); };
    const notify = (msg, icon = 'circle-check') => setToast({ msg, icon, k: Date.now() });
    const addToCart = item => { setCart(c => [...c, { ...item, id: Date.now() + Math.random() }]); notify(item.title + ' به سبد اضافه شد', 'shopping-cart'); };
    const searchDomain = q => { setDomainSeed(s => ({ q: q || '', n: s.n + 1 })); go('domains'); };
    const price = p => p;

    useEffect(() => { const f = () => { setRoute(parseHash()); setCartOpen(false); setPalette(false); }; window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
    useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 2800); return () => clearTimeout(t); }, [toast]);
    useEffect(() => {
      const onKey = e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPalette(o => !o); }
        if (e.key === 'Escape') { setPalette(false); setCartOpen(false); }
      };
      const onScroll = () => {
        const h = document.documentElement.scrollHeight - innerHeight;
        if (progRef.current) progRef.current.style.transform = 'scaleX(' + (h > 0 ? scrollY / h : 0) + ')';
        setShowTop(scrollY > 700);
      };
      window.addEventListener('keydown', onKey); window.addEventListener('scroll', onScroll, { passive: true });
      return () => { window.removeEventListener('keydown', onKey); window.removeEventListener('scroll', onScroll); };
    }, []);

    const page = route.split('/')[0];
    const isPanel = page === 'panel' || page === 'admin';
    function chrome(children, noFooter) {
      return html`
        <div className="relative z-10 flex flex-col min-h-screen">
          <${Navbar} page=${page} onPalette=${() => setPalette(true)} onCart=${() => setCartOpen(true)} cartCount=${cart.length} />
          <main className="flex-1">${children}</main>
          ${!noFooter && html`<${Footer} />`}
        </div>`;
    }

    let body;
    if (isPanel) {
      if (!SESSION) body = chrome(html`<${AuthPage} next=${route} />`, true);
      else if (page === 'admin' && SESSION.role !== 'admin') body = chrome(html`<div className="max-w-lg mx-auto px-4 py-28 text-center"><${Empty} icon="lock" title="دسترسی به پنل مدیریت ندارید" text="با حساب مدیر وارد شوید." action=${html`<button onClick=${() => go('panel')} className=${BTN_P + ' px-5 h-10 text-sm'}>رفتن به پنل کاربری</button>`} /></div>`);
      else body = html`<${PanelShell} kind=${page === 'admin' ? 'admin' : 'user'} route=${route} onPalette=${() => setPalette(true)}>${page === 'admin' ? html`<${AdminPanel} route=${route} />` : html`<${UserPanel} route=${route} />`}<//>`;
    } else {
      const P = { home: HomePage, vps: VpsPage, hosting: HostingPage, about: AboutPage, contact: ContactPage, terms: TermsPage }[page];
      body = chrome(page === 'domains' ? html`<${DomainsPage} seed=${domainSeed} />` : page === 'auth' ? html`<${AuthPage} />` : P ? html`<${P} />` : html`<${NotFound} />`, page === 'auth');
    }

    const ctx = { page, route, go, price, addToCart, notify, searchDomain };
    return html`
      <${AppCtx.Provider} value=${ctx}>
        <div className="app relative min-h-full text-white font-sans">
          <${MeshBackground} />
          ${!isPanel && html`<div className="fixed top-0 inset-x-0 h-[2px] z-50 origin-right acc-bg" ref=${progRef} style=${{ transform: 'scaleX(0)', top: 'env(safe-area-inset-top, 0px)' }} />`}
          ${body}
          ${showTop && !isPanel && html`
            <button onClick=${() => window.scrollTo({ top: 0, behavior: REDUCE ? 'auto' : 'smooth' })} aria-label="بازگشت به بالا"
              className=${GLASS_STRONG + ' pop-in fixed left-4 sm:left-6 z-40 w-12 h-12 rounded-2xl grid place-items-center hover:bg-white/20 shadow-xl'}
              style=${{ bottom: 'calc(20px + env(safe-area-inset-bottom, 0px))' }}>
              <${Icon} name="chevron-down" size=${20} className="rotate-180" />
            </button>`}
          ${palette && html`<${Palette} onClose=${() => setPalette(false)} onCart=${() => setCartOpen(true)} />`}
          ${cartOpen && html`<${CartDrawer} cart=${cart} setCart=${setCart} onClose=${() => setCartOpen(false)} />`}
          ${toast && html`
            <div key=${toast.k} role="status" className="toast-in fixed left-1/2 z-[90] rounded-2xl px-5 py-3.5 text-sm flex items-center gap-3 shadow-2xl bg-[#0a0c14]/90 backdrop-blur-xl border border-white/[0.12] max-w-[92vw]"
              style=${{ bottom: 'calc(24px + env(safe-area-inset-bottom, 0px))', transform: 'translateX(-50%)' }}>
              <span className="w-8 h-8 rounded-xl acc-bg grid place-items-center shrink-0"><${Icon} name=${toast.icon} size=${16} className=${toast.icon === 'loader-circle' ? 'animate-spin' : ''} /></span>${toast.msg}
            </div>`}
        </div>
      <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();

</script>
</body>
</html>
