# Single-node MinIO for database backups (or use any S3-compatible storage and skip this file).
# Credentials come from the minio-root secret created by setup-cluster.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: gereh-system }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 500Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: gereh-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: [server, /data, --console-address, ":9001"]
          envFrom: [{ secretRef: { name: minio-root } }]
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: minio-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: gereh-system }
spec: { selector: { app: minio }, ports: [{ name: s3, port: 9000 }, { name: console, port: 9001 }] }
---
# backup jobs live in the same namespace; let them in despite the default deny
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: minio-from-jobs, namespace: gereh-system }
spec:
  podSelector: { matchLabels: { app: minio } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ podSelector: {} }] }]
